<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inochi2D Viewer</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="sidebar">
    <h2>Modelo</h2>
    <label id="file-label" for="model-file">
      Cargar modelo<br />
      <small>.inp / .inx</small>
    </label>
    <input type="file" id="model-file" accept=".inp,.inx" />
    <p id="status">Cargando WASM...</p>

    <h2>Camara</h2>
    <div class="control-group">
      <label>Pos X <span id="val-x">0</span></label>
      <input type="range" id="ctrl-x" min="-2000" max="2000" value="0" step="1" />
    </div>
    <div class="control-group">
      <label>Pos Y <span id="val-y">0</span></label>
      <input type="range" id="ctrl-y" min="-2000" max="2000" value="0" step="1" />
    </div>
    <div class="control-group">
      <label>Zoom <span id="val-zoom">1.00</span>x</label>
      <input type="range" id="ctrl-zoom" min="0.05" max="8" value="1" step="0.01" />
    </div>
    <div class="control-group">
      <label>Rotacion <span id="val-rot">0</span>deg</label>
      <input type="range" id="ctrl-rot" min="-180" max="180" value="0" step="1" />
    </div>
    <button class="secondary" id="btn-reset-cam">Resetear camara</button>

    <div id="params-section">
      <h2>Parametros</h2>
      <button class="secondary" id="btn-reset-params">Resetear parametros</button>
      <div id="params-list"></div>
    </div>
  </div>

  <div id="canvas-container">
    <canvas id="inochi-canvas"></canvas>
    <div id="hud">
      x: <span id="hud-x">0</span>
      y: <span id="hud-y">0</span>
      zoom: <span id="hud-zoom">1.00</span>x
      rot: <span id="hud-rot">0</span>deg
    </div>
  </div>

  <script type="module" src="./viewer.js"></script>
</body>
</html>
