[package]
name = "inochi-viewer"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
inox2d        = { path = "../inox2d/inox2d" }
inox2d-opengl = { path = "../inox2d/inox2d-opengl" }

glam = "0.29"
glow = "0.14"
wasm-bindgen = "0.2"
js-sys = "0.3"
log = "0.4"
console_log = "1"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
  "Window", "Document", "HtmlCanvasElement",
  "WebGl2RenderingContext", "WebGlProgram", "WebGlShader",
  "WebGlBuffer", "WebGlTexture", "WebGlUniformLocation",
  "WebGlFramebuffer", "WebGlRenderbuffer", "console", "Performance",
]

[features]
default = []

[profile.release]
opt-level = "s"
lto = true